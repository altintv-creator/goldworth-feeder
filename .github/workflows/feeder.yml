name: GoldWorth Feeder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fiyatlari cek
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
          ALTINAPI_KEY: ${{ secrets.ALTINAPI_KEY }}
        run: |
          curl -sS -f \
            "https://api.metals.dev/v1/latest?api_key=$METALS_API_KEY&currency=USD&unit=toz" \
            -o metals.json

          curl -sS -f -H "X-API-Key: $ALTINAPI_KEY" \
            "https://altinapi.com/api/v1/prices" -o altinapi.json

          node scripts/feed.js

          rm -f metals.json altinapi.json

      - name: Degistiyse kaydet
        run: |
          git config user.name "goldworth-feeder"
          git config user.email "feeder@users.noreply.github.com"
          git add prices.json history/
          git diff --staged --quiet && exit 0
          git commit -m "fiyat guncelleme"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
