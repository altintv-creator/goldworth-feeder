name: GoldWorth Feeder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fiyatlari cek
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
          ALTINAPI_KEY: ${{ secrets.ALTINAPI_KEY }}
        run: |
          curl -sS -f \
            "https://api.metals.dev/v1/latest?api_key=$METALS_API_KEY&currency=USD&unit=toz" \
            -o metals.json

          curl -sS -f -H "X-API-Key: $ALTINAPI_KEY" \
            "https://altinapi.com/api/v1/prices" -o altinapi.json

          node -e "
            const fs = require('fs');

            // Onceki calistirmanin fiyatlari — degisim hesabi icin
            let prev = {};
            try {
              const old = JSON.parse(fs.readFileSync('prices.json','utf8'));
              for (const s of (old.tr?.symbols || [])) prev[s.symbol] = s.bid;
            } catch {}

            const m = JSON.parse(fs.readFileSync('metals.json','utf8'));
            const metals = m.metals || {};
            const c = m.currencies || {};
            const inv = (x) => (x > 0 ? 1 / x : null);

            const a = JSON.parse(fs.readFileSync('altinapi.json','utf8'));
            const rows = Array.isArray(a.data) ? a.data : [];
            if (rows.length === 0) { console.error('altinapi bos dondu'); process.exit(1); }

            const symbols = rows.map((r) => {
              const bid = Number(r.bid) > 0 ? Number(r.bid) : null;
              const ask = Number(r.ask) > 0 ? Number(r.ask) : null;
              const p = prev[r.symbol];
              const change = (bid != null && p > 0) ? bid - p : null;
              return {
                symbol: r.symbol,
                category: r.category || null,
                bid, ask,
                change,
                changePct: (change != null && p > 0) ? (change / p) * 100 : null
              };
            });

            const find = (sym) => symbols.find((s) => s.symbol === sym)?.bid ?? null;

            const out = {
              updatedAt: new Date().toISOString(),
                            global: {
                base: 'USD',
                goldPerOz: metals.gold ?? null,
                silverPerOz: metals.silver ?? null,
                goldPerGram: metals.gold ? metals.gold / 31.1034768 : null,
                silverPerGram: metals.silver ? metals.silver / 31.1034768 : null,
                allMetals: metals,
                allCurrencies: c,
                unitsPerUsd: {
                  TRY: inv(c.TRY), EUR: inv(c.EUR), INR: inv(c.INR),
                  AED: inv(c.AED), SAR: inv(c.SAR)
                }
              },
              tr: {
                // Mevcut ekranlarin kullandigi alanlar — degismedi
                altin: find('ALTIN'),
                gumus: find('GUMTRY'),
                usd: find('USDTRY'),
                eur: find('EURTRY'),
                gbp: find('GBPTRY'),
                stale: a.stale === true,
                sourceUpdatedAt: a.updatedAt || null,
                symbols
              }
            };

            if (out.global.goldPerOz == null) { console.error('metals.dev altin gelmedi'); process.exit(1); }
            if (out.tr.altin == null) { console.error('altinapi ALTIN gelmedi'); process.exit(1); }

            fs.writeFileSync('prices.json', JSON.stringify(out, null, 2));
          "

          rm -f metals.json altinapi.json

      - name: Degistiyse kaydet
        run: |
          git config user.name "goldworth-feeder"
          git config user.email "feeder@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "fiyat guncelleme"
          git push
